<script>window.FLIP={"pages":["pages/001.webp","pages/002.webp","pages/003.webp","pages/004.webp","pages/005.webp","pages/006.webp","pages/007.webp","pages/008.webp","pages/009.webp","pages/010.webp","pages/011.webp","pages/012.webp","pages/013.webp","pages/014.webp","pages/015.webp","pages/016.webp","pages/017.webp","pages/018.webp","pages/019.webp","pages/020.webp","pages/021.webp","pages/022.webp","pages/023.webp","pages/024.webp","pages/025.webp","pages/026.webp","pages/027.webp","pages/028.webp","pages/029.webp","pages/030.webp","pages/031.webp","pages/032.webp","pages/033.webp","pages/034.webp","pages/035.webp","pages/036.webp","pages/037.webp","pages/038.webp","pages/039.webp","pages/040.webp","pages/041.webp","pages/042.webp","pages/043.webp","pages/044.webp","pages/045.webp","pages/046.webp","pages/047.webp"],"texts":["tHe LONDON SCHOOL or ECONOMICS ano POLITICAL SCIENCE @ Educational Stratification in the Rentier State: A Triple Difference Analysis of TIMSS Mathematics and Science Outcomes in Qatar and the UAE (2011-2019) Suhaimi Bin Zainal Shah August 6, 2026 Supervisor: Dr Liam F. Beiser-McGrath A dissertation submitted to the Department of Social Policy, London School of Economics and Political Science, in partial fulfilment of the requirements for the Master of Science in International Social and Public Policy.","Abstract Despite sharing rentier macroeconomic structures and knowledge-economy aspirations, Qatar and the United Arab Emirates (UAE) pursued divergent public educational governance trajectories between 2011 and 2019. In 2016, Qatar dismantled its independent schools quasi- market and consolidated public education under unified ministerial oversight. In contrast, the UAE expanded a New Public Management quasi-market reliant on privatised provision and competitive choice. Utilising a most-similar systems design, this dissertation assesses how these divergent models shape educational stratification. Applying a Triple Difference econometric model to 2015 and 2019 Grade 8 TIMSS student-level microdata, this study evaluates Mathematics and Science achievement across demographic and socioeconomic status (SES) strata. By operationalising SES via a “books-at-home” proxy and controlling for individual educational expectations, the analysis elucidates a dual institutional dynamic. While Mathematics remained stratified, Qatar’s recentralisation compressed the socioeconomic gradient in infrastructure-reliant Science, suggesting that the reform effectively standardised physical facilities within public schooling. However, across both states, fee- regulated private quasi-markets exhibit stark disparities. Specifically, the results uncover an “Expatriate Premium” for students with foreign-born parents, alongside an independent “Migrant Penalty” for foreign-born students navigating the precarious middle-tier of private provision. Grounded in Resource Dependence Theory and Effectively Maintained Inequality, this study argues that although marketised systems accelerate elite attainment, they structurally disadvantage vulnerable populations. Interpreted through a behavioural lens, the findings reveal that a heavily financialised market landscape imposes a regressive cognitive burden on lower-SES families. Ultimately, sustainable education reform requires decoupling essential infrastructure from market mechanisms. As Qatar’s recentralisation suggests, high-quality public defaults can provide the structural conditions necessary for students’ highly significant educational expectations to be realised. Keywords: Education Policy, Educational Stratification, Effectively Maintained Inequality, New Public Management, Rentier State, Resource Dependence Theory, Triple Difference Page 2 of 47","Acknowledgements I would like to express my sincere gratitude to my supervisor, Dr Liam F. Beiser-McGrath, for his invaluable guidance, rigorous feedback, and unwavering support throughout this dissertation. I am also indebted to Dr Sonia Exley, Dr Hossain Mobarak, and Professor Adam Oliver for their generous time and constructive critiques which helped shape the theoretical and methodological frameworks of this research. I extend my appreciation to the Department of Social Policy at the London School of Economics (LSE) for fostering a stimulating academic environment, and to the LSE Middle East Centre for facilitating local contacts and regional context for the Arab Gulf. My visit to Doha’s Education City deeply enriched my understanding of the region’s institutional landscape. I am also thankful to the IEA for providing the open-access TIMSS microdata that made this empirical analysis possible. Furthermore, I am grateful to LBKM Singapore and the Lee Foundation for their financial support which enabled me to pursue this postgraduate degree at LSE. Finally, my deepest gratitude goes to my family, and above all, to my wife, Nur Liyana Binte Osman, for their encouragement, patience, and understanding throughout the many months of research and writing. This milestone is a testament to their support, love, and belief in me. Page 3 of 47","Table of Contents Chapter 1: Introduction .......... ce eessesssesseesececcseeececesesceeessesesceassesscsaesecessseesaceaseeeseeasees [Page 6] 1.1 Background 1.2 The Policy Divergence 1.3 Rationale and Questions 1.4 Empirical Aims Chapter 2: Literature Review and Theoretical Framework ..............sessssecseceeeeeeeeeeees [Page 10] 2.1 The Rentier State and Stratification 2.2 New Public Management and Effectively Maintained Inequality 2.3 Resource Dependence Theory and the Laboratory Divide 2.4 Literature Gaps and Contribution Chapter 3: Methodology. sssssssiesvessvssasevssvsasnensescsnssccsvvesesssseccesserseveraivenennieeveavaseevess [Page 15] 3.1 Research Design 3.2 Data and Sample 3.3 Empirical Strategy 3.4 Operationalisation and Weighting Protocols 3.5 Limitations Chapter'd: ReSUlts ssssescecessoxsssoneevenaseusnsnexcreneenxanvansvavsnvssnsecsorexsovsnsusssesrearcanceweovserseneorens [Page 21] 4.1 Mathematics: The Limits of Centralisation 4.2 Science: Centralisation and the Laboratory Divide 4.3 Demographic Determinants: The Expatriate Premium and the Migrant Penalty 4.4 Individual Educational Expectations and Structural Limits 4.5 Robustness Checks Chapter 5: Discussion and Policy Implications ............ cs sesssssseeeeeceessecececeeeeceseeeeeeeaes [Page 27] 5.1 Revisiting the Laboratory Divide 5.2 Unmasking the Expatriate Premium and Structural Migrant Penalties 5.3 Navigating the Rentier Psychological Contract and the Reverse Gender Gap 5.4 Policy Synthesis: The Behavioural Lens Chapter 6: Conclusion ...........:cccssssssccsceeccecssccsecseesccaceccceceescesceecaeeeceaeeeseccaeenceaeeeeees [Page 32] 6.1 Summary of Findings 6.2 Theoretical Contributions 6.3 Limitations and Future Research 6.4 Concluding Remarks References ........cccccsscssscecssccssscecsecesseecssecesseecseeecsecesseecesecesseeceseecceecseneecuecsenscseecesseeesaeeess [Page 35] APPeN ice ........cseeccecsesceceecceccecesccscesccssescsscessesccacesccusesccssecsecssseeceesecceaseeeeeeeasenceasensees [Page 43] Appendix A: Data Availability Statement and SPSS Syntax Appendix B: Descriptive Statistics Appendix C: Descriptive Trends Page 4 of 47","List of Tables Table 4.1: The Triple Difference Estimates [Page 22] Table 4.2: Robustness Checks [Page 26] Table Bi: Operationalisation Schema and Descriptive Statistics [Page 51] List of Figures Figure 4.1: Predictive Margins of Science Achievement by SES [Page 24] Figure 4.2: Structural Premiums and Penalties in Science [Page 25] Figure C1: Pre-Treatment and Post-Intervention Trends in Science Achievement [Page 47] Page 5 of 47","CHAPTER 1: INTRODUCTION 1.1 Background Globally, the expansion of mass education frequently fails to eradicate socioeconomic status (SES) stratification across developed and developing economies (Montt, 2011). Seeking to optimise educational outcomes and efficiency, the global diffusion of New Public Management (NPM) increasingly positions market competition, decentralisation, and school choice as primary policy levers (Verger et al., 2016). When translated to the Arab Gulf, specifically the Gulf Cooperation Council (GCC), these international reform templates encounter a highly idiosyncratic macroeconomic environment. This dissertation examines the political economy of education in Qatar and the United Arab Emirates (UAE). As critical economic anchors within West Asia, these high-income rentier states view the transition toward knowledge-based economies as a central strategic imperative. National development blueprints, specifically ‘Qatar National Vision 2030’ (GSDP, 2008) and ‘We the UAE 2031’ (UAE Government, 2022), link future economic resilience directly to globally competitive human capital. Historically, the rentier psychological contract, underwritten by vast hydrocarbon revenues and characterised by guaranteed, lucrative public-sector employment alongside substantial state allowances, particularly for male citizens, has inadvertently suppressed underlying incentives for rigorous academic achievement (Ridge, 2014; Hertog, 2020). Regional educational reform discourse often centres on how to overcome this socioeconomic inertia, typically highlighting the tension between NPM, which frequently yields stratified quasi-markets (Verger et al., 2016), and traditional, centralised state provision. Ultimately, the overarching macro-architecture of the state, navigating between these marketised and centralised models, is a central structural determinant of educational stratification. 1.2 The Policy Divergence Between 2011 and 2019, Qatar and the UAE embarked on distinct public education policy pathways, enabling a most similar systems design (MSSD) study (Przeworski & Teune, 1970). Despite sharing highly analogous demographic imbalances (an approximate 1:9 citizens-to-non- citizens ratio), rentier economic structures, and segmented labour markets (De Bel-Air, 2014, 2015; Ridge, 2014; Hertog, 2012), they embarked on fundamentally divergent approaches to public education management. Qatar’s 2016 recentralisation was a direct reaction against the Education for a New Era (EFNE) reforms. Designed by the RAND Corporation in the early 2000s, EFNE introduced decentralised “Independent schools” that were state-funded but privately operated, closely resembling the Page 6 of 47","American charter-school model which competed for students. Over time, Qatar institutionalised this quasi-market through legislation supporting independent operators (State of Qatar, 2006). However, recognising profound systemic frictions, the state reversed course. These include lagging Organisation for Economic Co-operation and Development (OECD) Programme for International Student Assessment (PISA) and International Association for the Evaluation of Educational Achievement (IEA) Trends in International Mathematics and Science Study (TIMSS) benchmarks (Said, 2016) and an entrenched reliance on private tutoring (Romanowski et al., 2013). Concurrently, marketisation provoked deep cultural dissatisfaction among citizens over compromised traditional values (Benmansour, 2017), while schools suffered under overwhelming administrative bloat and bureaucratic mandates (Al-Kubaisi, 2022). State of Qatar’s Emiri Decree No. 9 (2016) and Law No. 9 (2017) marked the institutional end of this RAND-designed apparatus, formally dissolving the Supreme Education Council (SEC), the semi-autonomous body that had overseen the independent schools system since 2002. Qatar then consolidated its regulatory functions within the Ministry of Education and Higher Education (MOEHE) (Amin & Cochrane, 2023). By absorbing these formerly independent operators back into a traditional ministerial hierarchy, the Qatari state rejected the quasi-market framework, seeking instead to mitigate market volatilities, alleviate the cognitive and cultural taxation on households, and establish a universal baseline of educational quality (Amin & Cochrane, 2023). Importantly, because Qatar’s 2012 private school voucher system and 2015 private-school regulations remained active throughout the 2011-2019 window analysed here (State of Qatar, 2012, 2015), the 2016 recentralisation represents a consolidation of public-sector educational governance layered atop a continuing private market, rather than a wholesale reversal of privatisation. In contrast, the UAE accelerated its commitment to regulatory governance and engineered a highly competitive market landscape. During the same period, Dubai institutionalised rigorous school inspection regimes that explicitly tied funding and fee structures to performance ratings (KHDA, 2017, 2019), doubling down on a marketised model requiring parents to navigate the system as rational consumers. Abu Dhabi subsequently expanded its charter school initiatives (adopting the American terminology) and Education Partnership Schools (ADEK, 2019), representing a clear move toward greater private operator involvement in delivering publicly- funded schooling. While the federal Ministry of Education oversees public schools in the Northern Emirates, Abu Dhabi (ADEK) and Dubai (KHDA) command the vast majority of the nation's student population and drive the UAE's overarching marketised policy trajectory. Page 7 of 47","1.3 Rationale and Questions While considerable research evaluates these divergent reforms, their distributive outcomes remain under-examined, sometimes overlooking the region's unique demographic architecture (Ridge et al., 2015). Treating the student body as homogenous obscures severe stratification between high-income expatriates and marginalised economic migrants. While Amin and Cochrane (2023) examine enrolment and demographic shifts using Qatari administrative data, their analysis relies on aggregate ministry reports rather than student-level microdata or International Large-Scale Assessment (ILSA) outcomes. A significant empirical gap remains as no study compares the distributional educational stratification effects of Qatar’s public schools’ recentralisation against the UAE’s quasi-market using empirical ILSA data. This dissertation addresses this gap, studying how state provision versus marketised choice impacts educational stratification through Resource Dependence Theory (RDT) and Effectively Maintained Inequality (EMI). RDT frames institutional reliance on essential physical and instructional resources, contrasting state-led infrastructural redistribution against market-driven allocation, whereas EMI articulates how high-SES actors continuously secure educational advantages, thereby reproducing stratification. This paper is guided by the following research questions (RQs): e RQ1: How did Qatar’s 2016 recentralisation of public educational provision impact overall socioeconomic stratification, relative to the UAE’s marketised landscape? e RQz2: To what extent do SES and foreign-born status independently mediate or compound structural stratification within rentier education systems? e RQ3: To what extent do the impacts of these governance models vary between Mathematics and Science? e RQ4: To what extent can individual educational expectations mitigate these structural disparities, and how does the overarching macro-architecture of the state facilitate or constrain these ambitions? 1.4 Empirical Aims To answer these questions, this study employs a triple difference (DDD) ordinary least squares (OLS) model, applied to Grade 8 TIMSS student-level microdata spanning 2011, 2015, and 2019 (IEA, 2013, 2017, 2021). Capitalising on the MSSD framework, the model seeks to approximate the systemic effect of Qatar's 2016 public education recentralisation against the UAE’s continuous quasi-market expansion. Page 8 of 47","While TIMSS contains multidimensional datasets spanning student, teacher, and school administration levels, this study deliberately confines its empirical design to student-level microdata. This scoping choice prioritises the direct estimation of macro-structural governance shocks on socioeconomic achievement gradients, treating institutional pedagogical variables as an intentional boundary condition. The DDD estimator quantifies stratification by interacting time (pre- and post-2016), geography (Qatar versus the UAE), and SES, operationalised via the “books-at-home” metric. To untangle the rentier-state demographic landscape, the model controls for foreign-born status, material possessions and individual educational expectations. Findings indicate that while centralisation did not alter the socioeconomic gradient in Mathematics, it substantially compressed stratification in infrastructure-reliant Science. Although bounded by observational limits, this compression aligns with Qatar's 2016 reform, pointing to how centralisation eased the “laboratory divide” for lower-SES cohorts. Concurrently, the models expose a persistent reverse gender gap alongside a severe “Migrant Penalty” for foreign-born students navigating private quasi-markets. Finally, the analysis reveals that while structural constraints are profound, individual educational expectations act as a vital mitigating buffer, underscoring the complex interplay between macro-state architecture and student ambition. Page 9 of 47","CHAPTER 2: LITERATURE REVIEW AND - THEORETICAL FRAMEWORK 2.1 The Rentier State and Stratification Educational stratification in the Arab Gulf remains inseparable from regional macroeconomic structures. Rentier State Theory (RST) posits that states reliant on external rents develop unique socioeconomic contracts with citizens (Beblawi and Luciani, 1987). Distorted academic motivation among male citizens is widely documented, with guaranteed public employment correlating with weaker engagement in demanding Science, Technology, Engineering and Mathematics (STEM) subjects (Kayan-Fadlelmula et al., 2022; Ridge, 2014). This dynamic drives a reverse gender gap, as females, facing constrained labour market opportunities, leverage academic achievement for social mobility (Ridge, 2014). Hence, women’s academic gains reflect both male underinvestment and deliberate state-building strategies financed by rentier wealth (Bahry and Marr, 2005). Regional reliance on foreign labour creates a pronounced citizen and non-citizen divide. This bifurcation is codified by the regional “kafala” (sponsorship) system, an institutional framework which ties non-citizen residency to employment contracts, precludes naturalisation (AlShehabi, 2021), and institutionalises a rigidly segmented labour market (Hanieh, 2011). With citizens comprising only 11-12% of the 2015 to 2019 cohorts, Qatar and the UAE are overwhelmingly inhabited by non-citizens (De Bel-Air, 2014, 2015). Treating this highly stratified population as homogeneous risks severe omitted variable bias, as combining nationals and non-nationals masks deep societal divisions. While children of higher-income expatriates often attend elite international schools and enjoy substantial achievement premiums, the educational quasi-market systematically penalises foreign-born students such as the children in families bordering the strict family sponsorship thresholds (Ridge et al., 2015). Therefore, rigorous policy evaluation in the Gulf, requires treating migration and residency status as a key determinant rather than a marginal control. While classic RST suggests that state wealth traditionally insulated citizens from the consequences of educational stratification (Beblawi and Luciani, 1987), the transition toward post-oil, knowledge-based economies has fundamentally altered this calculus. Severe educational stratification now poses an existential threat to nationalisation policies, such as Qatarisation and Emiratisation. If competitive market structures persistently concentrate instructional and physical capital among high-income expatriates while penalising lower-income demographics, rentier states will remain structurally incapable of replacing foreign expertise with home-grown human capital (Hertog, 2012). Page 10 of 47","2.2 New Public Management and Effectively Maintained Inequality The global diffusion of NPM positions decentralisation and school choice as primary mechanisms for optimising educational efficiency (Verger et al., 2016). While proponents argue that quasi- markets encourage institutional improvement through competitive pressure, empirical evidence suggests a systemic hazard. Almost all education systems that observed widened socioeconomic achievement gaps over the past two decades were decentralised (Broer et al., 2019). The theory of EMI posits that advantaged socioeconomic classes secure quantitative educational advantages, but as system expansion makes a level of schooling universal, these groups secure qualitative advantages such as superior institutional placement, thereby reproducing stratification (Lucas, 2001). High-SES families leverage social, economic and cultural capital to navigate school choice, concentrating in highly-rated elite institutions within fee-based systems (Bourdieu, 1986; Lareau, 2011), whereas lower-SES cohorts remain trapped in lower-fee schools restricted by performance- linked fee caps. Corroborating these institutional tensions, recent empirical accounts show that the UAE's reliance on privatisation and high-stakes metrics reorients professional practice toward business priorities and crowds out pedagogical autonomy (Winchip, 2021). Fundamentally, this inspection-driven decision-making environment generates institutional incongruencies that impede egalitarian access for lower-SES migrant communities (Litz & Blaik, 2023), stimulating market efficiency at the top of the socioeconomic distribution while deepening stratification at the bottom in line with EMI predictions (Lucas, 2001). Crucially, however, EMI was originally conceptualised within Western contexts where stratification is frequently mediated by neighbourhood sorting or implicit academic tracking (Lucas, 2001). Adapting EMI to the GCC requires accounting for an environment where tracking is explicitly financial, driven by fee-regulated quasi-markets, and closely tied to tiered sponsorship statuses. Within this stratified context, Qatar’s educational realignment offers a theoretical counter- narrative to NPM hegemony. Qatar's abolition of independent schools rejects the assumption that market competition inherently optimises public goods (Amin & Cochrane, 2023). Qualitative accounts reveal that the quasi-market introduced severe governance fragmentation and administrative offloading devoid of actual pedagogical authority (Romanowski et al., 2013). Romanowski and Du (2020) trace how this friction emerged because Qatar imported decentralisation from Western templates without sufficient adaptation to local conditions. This operational strain reinforced EMI because when schools are preoccupied with survival pressures and disjointed regulatory demands, they lack the institutional capacity required to support Page 11 of 47","marginalised students. Consequently, empirical survey evidence indicates that school leaders broadly welcomed subsequent recentralisation, as unified procedures streamlined operations and eliminated duplicated decision-making mechanisms (Al-Kubaisi, 2022). Qatar’s reversion to direct public provision therefore constitutes a macro-level attempt to disrupt EMI, theoretically blunting the financial and logistical tracking common in fee-regulated quasi-markets by decommodifying access and reasserting the state as a universal guarantor of baseline quality. 2.3 Resource Dependence Theory and the Laboratory Divide The gains associated with neutralising financial tracking do not appear uniform across all domains of learning. Understanding the distributional effects of state centralisation versus privatisation requires differentiating academic subjects by their specific infrastructural requirements. RDT provides a theoretical framework for this divergence by positing that institutional success remains contingent upon acquiring critical external resources over which organisations have limited control (Pfeffer & Salancik, 2003). Mathematics is a relatively resource-light subject reliant on pedagogical human capital, with effective instruction shaped more by teacher knowledge and classroom discourse than by specialised equipment (Adler, 2000). Science, however, is infrastructure-dependent, requiring laboratories and physical equipment, and unequal resource access disproportionately penalises vulnerable subgroups and may widen achievement gaps (Smith et al., 2016). Across the GCC, regional data indicate that private supplementary tutoring enrolment is systematically lower for Science than for Mathematics, as tutoring cannot easily substitute for capital-intensive laboratories and hands-on experimentation (Bray & Hajar, 2022). This resource dependency generates a “laboratory divide” under decentralised quasi-market conditions, where operator discretion over facilities investment creates high within-sector infrastructural variance. Ridge et al. (2015) document substantial resource disparities across Gulf private schools, with elite, high-fee institutions maintaining state-of-the-art facilities while schools serving lower-income non-national populations often operate with more limited infrastructure. In Qatar, survey evidence from the Qatar Education Study indicates that although many independent schools have dedicated science laboratories, school operators frequently report needs for improved equipment, maintenance, and additional specialised labs (SESRI, 2015). Further, there is considerable variation in how often students actually use the laboratories for hands-on experiments. ILSA data further corroborate the importance of standardised physical capital, as analyses of PISA show that shortages in science infrastructure are significantly associated with lower science achievement in decentralised education systems like Canada (Beese & Liang, 2010). Official TIMSS global metrics demonstrate a positive relationship between school-level resource availability, including dedicated science laboratories, and higher student Page 12 of 47","achievement (Martin et al., 2016a). Echoing these systemic dependencies, the Royal Society (2024) asserts that the chronic lack of adequate physical equipment directly hinders students from mastering concepts fundamental to science education. Fee-capped, lower-tier market schools lack the capacity to resolve this infrastructural deficit. Centralised governance models possess a comparative advantage in mass-procuring and standardising physical capital (Pfeffer & Salancik, 2003). State interventions hypothetically stand poised to generate larger stratification compression in resource-heavy subjects. However, proponents of educational marketisation contend that such critiques overlook logistical realities surrounding regional demographic expansion. Policy debates suggest that states like the UAE and Qatar lacked the systemic capacity to rapidly accommodate the influx of expatriate labour required for economic diversification without leveraging private capital (Ridge, 2014). From this perspective, the quasi-market initially represented a pragmatic compromise to deliver rapid infrastructural scaling. As these systems mature, however, their long-term stratifying effects increasingly demand systemic redress. 2.4 Literature Gaps and Contribution While Gulf literature frequently addresses NPM, most studies focus on system-level performance rather than stratification mechanisms. Empirical evaluations of Qatar’s pre-recentralisation landscape reveal the extreme stratifying power of explicit marketisation. For example, Cheema (2016) found that the effect of SES on literacy was almost four times larger within private institutions compared to public independent schools. This evidence demonstrates how fee- regulated markets actively compound EMI and socioeconomic sorting, a dynamic highly relevant to the UAE's privatised regime. Concurrently, it exposes the severe structural tensions inherent in Qatar's former EFNE quasi-market. Yet, existing analyses rarely trace how socioeconomic gradients evolve following specific policy reforms, such as Qatar’s subsequent abolition of the independent school model. Furthermore, ILSA-based regional studies often treat the student body as homogeneous, overlooking rentier-specific dynamics like migration status and gendered labour market incentives. The theoretical literature underpinning this dissertation also remains fragmented. RST accounts seldom connect macro-political economy to school-level governance, while sociological work on EMI is rarely applied to fee-regulated quasi-markets. Similarly, while RDT explains organisational behaviour, its implications for subject-specific stratification remain underdeveloped. This dissertation addresses these gaps in three ways. Firstly, it provides an initial quasi- experimental, microdata-based comparison of systemic effects, evaluating Qatar's Page 13 of 47","recentralisation against the UAE’s marketisation using DDD models to capture heterogeneous treatment effects on student-level outcomes. Secondly, this study foregrounds the Gulf distinctive demographic architecture by explicitly modelling migration status and gender dynamics as key determinants. Thirdly, it integrates EMI and RDT into a single explanatory account, illustrating how resource dependence and macro-architectural design shape the capacity of governance models to compress educational stratification. Page 14 of 47","CHAPTER 3: METHODOLOGY 3.1 Research Design This MSSD study evaluates the effects of divergent educational governance models (Przeworski & Teune, 1970). Qatar and the UAE provide a strong comparative framework as high-income rentier states pursuing knowledge-based transitions amid extreme demographic imbalances. Between 2015 and 2019, both maintained identical macroeconomic typologies as high-income economies (World Bank, 2024a; 2024b) with foreign labour constituting nearly 90% of their populations (De Bel-Air, 2014, 2015). Despite varying curricula (Al-Fadala, 2015), both share strict jus sanguinis citizenship regimes and heavy reliance on fee-regulated private provision. By reducing socioeconomic and cultural confounders through these shared typologies, subsequent stratification divergences can be plausibly attributed to their respective post-2015 governance trajectories, Qatar’s recentralisation versus the UAE’s marketisation. While this MSSD framework distinguishes the public-education governance shock, the treatment (i.e. recentralisation) was neither randomly assigned nor fully shielded from co-occurring private- sector dynamics, making it consistent with a quasi-experimental identification strategy that accommodates the overlapping complexities of real-world policy implementation. 3.2 Data and Sample While OECD’s PISA is frequently utilised in global educational evaluations, this study deliberately selects IEA’s TIMSS student-level microdata for its chronological and theoretical suitability. Chronologically, the TIMSS four-year assessment cycle between 2015 and 2019 neatly brackets the 2016 systemic policy shock in Qatar (IEA, 2017, 2019), providing an ideal pre-treatment baseline and a mature post-treatment window. Theoretically, TIMSS measures mastery of school- based curricula, making it sensitive to school-level resources (Mullis et al., 2009; Mullis & Martin, 2013, 2017) and thus rendering it optimal for testing RDT. Although the broader TIMSS architecture includes rich institutional and teacher questionnaires, this study deliberately focuses on student-level microdata to estimate macro-structural achievement gradients across stratified cohorts. To accurately bracket the policy shock, the 2015 cycle serves as the pre-treatment baseline when both nations pursued decentralised and quasi-market frameworks, whereas 2019 serves as the post-treatment observation. While the IEA employs rigorous stratified cluster sampling to ensure the TIMSS microdata is nationally representative through the application of normalised student weights (TOTWGT), the realities of the Arab Gulf necessitate important contextualisation regarding sample composition. Page 15 of 47","First, the data inherently reflects a highly urbanised city-state landscape, with student populations overwhelmingly concentrated within the metropolitan cores of Doha, Abu Dhabi, and Dubai. Second, the non-national student sample is subject to left-censoring. As Gardner (2011) notes, Gulf kafala family visa policies set minimum salary requirements (e.g. UAE AED 10,000 per month), which effectively exclude most low-income migrant labourers, predominantly South Asian manual workers, from family reunification in the host states. Consequently, the expatriate K-12 populations captured in the TIMSS microdata do not represent the absolute bottom of the socioeconomic spectrum. Rather, they reflect a pre-selected middle-tier demographic, ranging from economically affluent to precarious expatriate families who meet baseline sponsorship criteria (Babar, 2017). Finally, it is methodologically vital to distinguish between the broader educational ecosystem captured by TIMSS microdata and the specific target of Qatar’s 2016 recentralisation. This policy reform directly restructured the public independent school sector, which primarily serves Qatari citizens alongside specific non-citizen categories permitted by state regulations, including GCC nationals, children of Qatari mothers, and dependents of public sector or ministerial employees (Ridge et al., 2015). Accordingly, while the DDD estimator attempts to capture the infrastructural standardisation experienced within the public sphere, the demographic covariates (such as the Migrant Penalty) capture the persistent structural inequalities of non-citizen students navigating the private quasi-markets across both national contexts. 3.3 Empirical Strategy To estimate the systemic impact of Qatar’s 2016 recentralisation on specific socioeconomic strata, this study employs a fully specified DDD estimation. The model extends the traditional Difference-in-Differences (DiD) framework to capture heterogeneous treatment effects, adhering to standard econometric protocols for isolating policy impacts in observational data (Angrist & Pischke, 2008). This enables testing whether the policy disproportionately impacted vulnerable subgroups. The primary econometric specification is defined as: Yise = Bo + Bi(Qatar) + B,(2019) + B3(LowerSES) + B,(Qatar x 2019) + B;(Qatar x LowerSES) +B,(2019 x LowerSES) + B;(Qatar x 2019 x LowerSES) + yXist + €ist In this model, Y,,, represents the TIMSS achievement score (Mathematics or Science) for student iin country s at time t. The baseline DiD estimator is #,, which captures the standard policy effect of Qatar's 2016 shift relative to the UAE. The parameter of primary stratification interest is the DDD interaction term. This coefficient computes the specific, additional treatment effect experienced by the lower-SES students. A positive and statistically significant 6, indicates that Page 16 of 47","the return to centralised public provision structurally compressed stratification. For completeness, yX;,, represents a vector of student-level covariates controlling for observable confounders, and ¢;,; is the robust error term. To satisfy the Parallel Trends Assumption and verify the identification strategy, a placebo test was executed using the 2011 and 2015 TIMSS cohorts. Treating 2015 as a dummy intervention year tests for pre-existing divergence in the socioeconomic achievement gradient. Since both states operated under shared quasi-market baselines between 2011 and 2015, subsequent divergence in 2019 can be more confidently attributed to the 2016 policy reform. Earlier placebo testing was precluded as the 2007 TIMSS dataset excluded the UAE as a national entity (Olson et al., 2009). Furthermore, the model is run separately for Mathematics and Science to evaluate whether structural standardisation is domain-specific. If RDT holds, the DDD estimator should demonstrate a statistically significant positive compression of the SES gradient for vulnerable subgroups in capital-intensive Science. This interaction coefficient should remain negligible in Mathematics, where outcomes rely predominantly on pedagogical human capital rather than physical institutional infrastructure. This comparative approach provides the empirical basis for testing the laboratory divide hypothesis within the rentier architecture of the Gulf. 3.4 Operationalisation and Weighting Protocols Conventional models often use maximum parental education as an SES proxy. However, preliminary diagnostics for the Grade 8 cohorts in both countries showed parental-education item non-response exceeding 31%. As this missingness is strongly patterned by foreign-born status, listwise deletion would disproportionately exclude marginalised students and risk severe attrition bias (Ridge et al., 2015; Rubin, 1987). Consequently, parental education and composite SES indices were omitted in favour of the more statistically stable books-at-home proxy, supplemented by separate binary indices of household possessions. In Bourdieu’s (1986) terms, the books-at-home index captures objectified cultural capital in the form of material cultural goods, which are transmitted through family practices and linked to students’ habitus, or disposition toward schooling and learning (Gaddis, 2013). Methodological work suggests that this indicator is a useful, though imperfect proxy for SES. Sieben and Lechner (2019) find acceptable reliability and validity for book possession as a measure of objectified cultural capital, while Balzer et al. (2025) show that adding digital book collections yields only marginal additional information in their sample. In international survey research, books-at-home therefore remain a widely used indicator of relative educational advantage, but one that should be interpreted cautiously as context-sensitive rather than fully equivalent to absolute wealth. Page 17 of 47","Acknowledging this sensitivity, this dissertation treats the measure as an imprecise SES proxy rather than a direct causal mechanism (Jerrim et al., 2019). It remains vulnerable to reporting error and cross-cultural variation (Engzell, 2019; Jerrim & Zieger, 2024). In the Gulf context, expatriate households often live under conditions of transience and _ tenancy-based accommodation (Elsheshtawy, 2019), so low book accumulation may partly reflect residential mobility and the practical constraints of temporary housing rather than household SES alone. Nevertheless, its retention as the primary baseline metric is justified by robust empirical validation. First, Hanushek and Wo8mann (2011) demonstrate the proxy’s macro-institutional stability, establishing that its predictive power holds across roughly 50 different educational systems and supporting its use when comparing divergent governance architectures like Qatar and the UAE. Second, Evans et al. (2010) establish its independent social effect across 27 diverse nations, indicating that book possession isolates educational advantage even when other structural variables are controlled for. Given the high missing data for parental education and the absence of income measures in the public ILSA dataset, dichotomising the standard TIMSS books-at-home categorical measure (o-— 10, 11-25, 26-100, 101-200, >200) into a binary lower-SES flag (25 or fewer books) remains the most statistically viable way to implement DDD estimations without exacerbating attrition bias. While this cut-point is researcher-defined and best interpreted as a relative indicator of disadvantage within the GCC sample rather than an absolute cross-national measure (Jerrim et al., 2019; Rutkowski & Rutkowski, 2013), it provides a robust and stable baseline that effectively circumvents the missing-data traps threatening the integrity of the broader comparative design. To separate the effects of household material wealth from objectified cultural capital, separate binary indices of home educational resources such as computer ownership are modelled alongside the books-at-home proxy (Lareau, 2011). Including student educational expectations, gender, and migration status is also methodologically imperative. While aggregate Gulf ILSA data indicates a phenomenon of “migrant optimism”, where expatriates hold higher expectations and outperform natives overall (Ali et al., 2022), treating this population homogeneously masks deep structural stratification. Aggregating these outcomes obscures the severe penalties inflicted upon the precarious middle-tier of economic migrants. Therefore, individual educational expectations are modelled to account for dispositional variations in academic drive, while cohort composition is controlled via foreign-birth indicators for both the student and parents, alongside gender dummies. These serve as robust structural controls within a strict jus sanguinis rentier-state architecture. Page 18 of 47","A rigorous data-cleaning protocol applied listwise deletion for missing demographic covariates to the initial 2015 and 2019 Grade 8 sample of 49,633 students, yielding a final analytic sample of 44,300. Following the procedures specified in TIMSS technical documentation (Martin & Mullis, 2012; Martin et al., 2016b; Martin et al., 2020), total student weights (TOTWGT) were normalised to the analytic sample size to preserve the complex two-stage stratified cluster sampling without artificially inflating statistical power (Rutkowski et al., 2010). Moreover, because TIMSS estimates student proficiency using a multiple imputation methodology, all five Plausible Values were modelled separately. The unstandardised coefficients and standard errors were then pooled using Rubin’s (1987) rules to incorporate both within- and between-imputation variance. Remaining demographic covariates were coded as binary dummies for tractable econometric estimation. The full operationalisation schema and descriptive statistics appear in Table B1 (Appendix B), with the open-access data links and complete SPSS syntax provided in Appendix A to facilitate independent replication and verification. 3.5 Limitations While the MSSD and DDD estimators provide a robust framework for evaluating policy impacts, this study acknowledges several methodological limitations inherent to ILSAs. First, because TIMSS national sampling includes all educational sectors and caps exclusions (Martin et al., 2020), this analysis cannot estimate a pure average treatment effect on the treated specifically for the public sector. Instead, the model estimates an intention-to-treat (ITT) effect (Angrist & Pischke, 2008), capturing system-level exposure to the reform rather than treated schools alone. As including unaffected private-school students dilutes the treatment coefficient, any stratification compression identified could be interpreted as a conservative, lower-bound estimate of the policy's true systemic impact. Second, regarding econometric architecture, this study strictly estimates models independently across all five Plausible Values (Broer et al., 2019). Standard errors, however, could not be explicitly clustered at the school level across the pooled data. While failing to cluster typically underestimates variance, the substantial magnitude of the primary DDD estimator, as detailed in Chapter 4, provides a wide mathematical buffer, suggesting directional stability. Third, the cross-sectional nature of TIMSS captures aggregate cohort effects rather than tracking individual developmental trajectories over time, limiting the ability to observe individual-level academic mobility. Page 19 of 47","Fourth, the temporal scope is constrained. Adding temporally distant cycles introduces cohort differences that can undermine trend comparability (Chmielewski & Dhuey, 2016). While the 2011 to 2015 placebo test demonstrates parallel pre-reform trends, the subsequent 2023 TIMSS cycle coincided with pandemic disruptions, precluding its use. Exploiting the 2015 to 2019 window thus offers the strongest leverage without confounding global shocks. Finally, focusing on student-level microdata leaves the internal pedagogical environment unexamined. While TIMSS contains robust school-level lab and teacher questionnaires, controlling directly for these material inputs risks introducing “bad controls”, since infrastructural standardisation is a primary causal mechanism through which recentralisation operates. Consequently, a reduced-form student-level model was chosen to explicitly bound the analysis to macro-distributional equity, capturing aggregate systemic impacts without partialling out these structural channels. However, this design also means the quantitative estimates cannot reveal implementation micro-dynamics, such as how street-level bureaucrats (principals and teachers) exercised discretion in daily classroom practice (Lipsky, 1980). Coupled with unobserved policy shocks like curriculum reforms, findings should be read as evidence consistent with, rather than definitive proof of, the 2016 recentralisation’s causal contribution. Page 20 of 47","CHAPTER 4: RESULTS 4.1 Mathematics: The Limits of Centralisation Between 2015 and 2019, the fully specified DDD estimations (Table 4.1) establish significant baseline attainment growth in the UAE across both Mathematics (B = 15.18, p \u003c .001) and Science (B = 10.54, p \u003c .001). Lacking a statistically significant base DiD estimator for Mathematics (B = -5.31, p > .05), Qatar’s absolute growth statistically mirrored this broader regional trend. However, while both nations experienced attainment growth, their capacity to equitably distribute those gains diverged sharply based on the infrastructural dependency of the academic domain. In Mathematics, the DDD models suggest that systemic centralisation alone cannot dismantle stratification in a domain reliant on pedagogical human capital. Although overall achievement trended positively, the lower-SES DDD stratification estimator remained statistically insignificant (B = 4.29, p > .05). This indicates that Qatar’s 2016 recentralisation did not meaningfully disrupt how SES influences Mathematics achievement, demonstrating that returning to ministry oversight does not automatically neutralise EMI mechanisms (Lucas, 2001). While some qualitative accounts indicate that recentralisation successfully restored institutional coherence and unified administrative procedures (Al-Kubaisi, 2022), the negligible DDD estimator for Mathematics reflects the slower pace of systemic professional standardisation documented elsewhere (Nasser, 2017). Furthermore, the structural reform struggled to curb the entrenched reliance on private supplementary tutoring, a shadow market that heavily drives Mathematics outcomes and enables higher-SES students to maintain their advantage (Bray & Hajar, 2022). 4.2 Science: Centralisation and the Laboratory Divide Conversely, the identical specification applied to Science achievement (Table 4.1) yields markedly different results, lending strong empirical support to RDT (Pfeffer & Salancik, 2003). As Science requires capital-intensive laboratories, outcomes remain acutely sensitive to systemic resource allocation. While the baseline DiD estimator (B = 11.12, p \u003c .001) implies a substantial absolute surge in science performance for the Qatari cohort relative to the UAE, the DDD interaction term (B = 12.57, p \u003c .001) estimates a highly significant heterogeneous treatment effect. This indicates that Qatar’s 2016 recentralisation meaningfully compressed the internal stratification gradient for lower-resourced subgroups. Given that the underlying ITT design inherently dilutes the treatment coefficient by including unaffected private-school students, this positive DDD estimator is highly consequential. It suggests that the public-sector intervention was massive enough to generate systemic equity gains across the entire national aggregate. Page 21 of 47","Table 4.1: The Triple Difference Estimates Variable (1) Mathematics (2) Science Triple Difference (DDD Stratification Estimator) Qatar * 2019 * Lower-SES (DDD) 4.292 (4.881) Two-Way Interactions Qatar * 2019 (Base DiD ) -5.311 (3.224) Qatar * Lower-SES 2019 * Lower-SES Main Baselines Country (Qatar = 1) -4.661 (3.792) 6.126** (2.056) -20.687*** (2.241) Cohort Year (2019 = 1) 15.181*** (1.392) Lower-SES Proxy (0-25 Books =1) -40.192*** (1.594) Material/Economic Capital (Home Possessions) Possess a study desk 16.801*** (1.095) Possess own room Possess a computer 14.267*** (1.654) 5.640*** (1.519) 12.574** (4.535) 11.118*** (3.585) -3.792 (3.510) -1.466 (2.031) -13.412*** (2.565) 10.544*** (1.557) -37.584*** (1.811) 17.267*** (1.240) 15.370*** (1.940) 7.105*** (1.558) Demographic & Behavioural Covariates Sex is male 2.572** (0.840) -14.113*** (0.935) Parent born outside country 57.946*** (1.160) 65.649*** (1.179) Child born outside country -35.500*** (1.191) -38.348*** (1.146) Educational Expectations 15.187*** (0.379) 20.099*** (0.409) Note. N = 44,300. All coefficients (B) are pooled across 5 PVs using Rubin's rules and reported with robust standard errors in parentheses. Data sourced from the TIMSS 2015 and 2019 cohorts and weighted using a normalised TOTWGT to preserve complex survey design without inflating degrees of freedom. *** p \u003c .001, ** p \u003c .01, and * p \u003c .05. Page 22 of 47","This targeted stratification compression is visually captured in Figure 4.1, which plots the cohorts’ estimated marginal means. While the untreated UAE baselines showed modest improvements or stagnation between 2015 and 2019, both Qatari cohorts experienced steep upward trajectories, reflecting the sweeping systemic gains of the 2016 recentralisation. Crucially, the achievement gap between the higher- and lower-SES cohorts in Qatar visibly narrows by 2019, contrasting with the entrenched, stagnant gap in the UAE. This specific convergence visually manifests the +12.57 DDD coefficient, demonstrating that dismantling the quasi-market did not merely raise overall performance but disproportionately benefitted more vulnerable students. By redistributing standardised physical capital to public schools that had suffered severe infrastructural variance and inconsistent resourcing under the decentralised system, the state successfully insulated this precarious middle-tier and mitigated the laboratory divide. The magnitude of these empirical gains aligns precisely with regional policy documentation. Qatari school surveys and Gulf facility audits have repeatedly highlighted that access to adequately equipped, regularly used science laboratories is a systemic prerequisite for equitable STEM provision (SESRI, 2015; Ridge et al., 2015). The 2016 recentralisation executed this mandate at scale. This empirical outcome highlights the systemic limitations of marketised education systems, which inherently require households to leverage private economic, social and cultural capital to secure adequate learning environments. Reverting to direct ministerial provision established a centralised institutional default, effectively neutralising the disadvantages of quasi-market navigation and significantly compressing educational stratification. 4-3 Demographic Determinants: The Expatriate Premium and the Migrant Penalty The Science covariates expose stark demographic realities. While baseline home possessions such as a study desk (B = 17.27, p \u003c .001), yields expected academic premiums, these material advantages are dwarfed by severe demographic bifurcations. The data reveals a deeply entrenched reverse gender gap (see Figure 4.2) associated with rentier economics (Ridge, 2014). Controlling for all material possession covariates, male students suffer a substantial penalty in Science achievement (B = -14.11, p \u003c .001) compared to their female peers. Consistent with theoretical expectations of EMI, foreign birth indicators demonstrate a sharp, statistically significant migrant penalty (B = -38.35, p \u003c .001) while expatriates generate a substantial achievement premium (B = +65.65, p \u003c .001). Importantly, because Qatar’s 2016 recentralisation applied exclusively to the state-funded sector, the primary DDD estimator does not capture the vast majority of these migrant cohorts. Page 23 of 47","Figure 4.1 Predictive Margins of Science Achievement by SES sees s= UAE Higher-SES = = UAELower-SES == Qatar Higher-SES = Qatar Lower-SES 525 $500. rr 475 450 425 Estimated Science Achievement Score 400 2015 (Pre-Treatment) 2019 (Post-Treatment) Note. Estimated marginal means for Grade 8 Science achievement illustrating the Triple Difference (DDD) interaction. The bold green line represents the most vulnerable cohort (Qatar Lower-SES), which demonstrates a distinct, steep upward trajectory following the 2016 return to centralised public provision. This sharply contrasts with the relatively stagnant trends of the marketised UAE cohorts. Data is weighted using the normalised TOTWGT. Instead, these demographic covariates map the severe stratification occurring contemporaneously within the parallel private quasi-markets. Additionally, as both covariates are modelled simultaneously, the “Migrant Penalty” isolates the achievement deficit associated with the student’s own foreign birth, net of parental origin, as this is conceptually distinct from the “Expatriate Premium”, which captures the structural advantage of having a foreign-born parent. Translating this migrant coefficient into standard deviations reveals a -0.38 SD penalty, meaning non-national students operate nearly a full academic year behind their national peers. Given that the legal architecture of the kafala system left-censors the sample by excluding the lowest-income manual labour cohorts through strict family sponsorship thresholds, this penalty cannot simply be reduced to an artefact of absolute poverty. Rather, it captures deep stratification impacting the precarious middle-tier of non-national residents, such as Arab diaspora and South Asian families, who clear legal sponsorship criteria but remain exposed to the financial frictions of the educational quasi-market (Ridge et al., 2015). 4.4 Individual Educational Expectations and Structural Limits Page 24 of 47","By retaining student educational expectations in the regression, the model tests the independent predictive power of individual ambition. The output demonstrates that student expectations are highly significant predictors of academic success. In Science, increased educational expectation yields a substantial premium (B = +20.10, p \u003c .001) that is greater in magnitude than the baseline policy estimator itself. Nevertheless, these personal aspirations do not operate in a vacuum. Even when controlling for maximum individual ambition, the penalty for foreign-born status heavily offsets the attainment gains of high expectations. The DDD stratification estimator remains highly significant despite the inclusion of this covariate. This demonstrates that while individual academic drive is essential, it cannot unilaterally neutralise stratification without underlying macro-architectural reform. Figure 4.2 Structural Premiums and Penalties in Science Achievement Stratified Expatriate Premium Educational Expectations Male Penalty S| Structural Migrant _ -25 0 25 i) 2 © \u003c\u003c © > fe) oO Unstandardised Coefficient Note. Unstandardised coefficients (B) illustrating the magnitude of demographic and behavioural covariates on Grade 8 Science achievement. The chart highlights the severe bifurcations within the Gulf student body, where a structural expatriate premium at the top is mirrored by a penalty for the precarious middle-tier of migrants. Data is derived from the fully specified DDD model. Page 25 of 47","4.5 Robustness Checks: Parallel Trends and Long-Term Estimators To validate the primary estimators, a series of robustness checks were executed (Table 4.2). First, a fully specified in-time placebo test comparing the 2011 and 2015 pre-treatment cycles returned statistically insignificant DDD stratification estimators for both Mathematics (B = 4.11, p > .05) and Science (B = 1.71, p > .05). This satisfies the parallel trends assumption (supported visually by Figure C1 in Appendix C), indicating the socioeconomic stratification dynamics between Qatar and the UAE were not diverging during their shared quasi-market baseline prior to the 2016 reform. Subsequently, an extended 2011-2019 baseline model affirmed the durability of these stratification patterns. Over this eight-year horizon, the Science DDD estimator remained highly significant (B = 13.72, p \u003c .01) while the Mathematics estimator remained statistically insignificant (B = 7.74, p > .05). This persistent divergence between subjects with different resource dependence acts as a strong falsification test and anchors the empirical findings in RDT. Table 4.2: Robustness Checks [Placebo (2011 vs. 2015) and Long-term Estimators (2011 vs. 2019)] Variables Placebo Test Long-Term Effect Mathematics Achievement Lower-SES Proxy (0-25 Books =1) -29.120*** (1.756) -28.306*** (1.723) Country (Qatar = 1) -42.607*** (2.599) -42.402*** (2.607) Treatment Year (2015 / 2019 = 1) 9.747*** (1.456) 26.002*** (1.463) DDD Stratification Estimator 4.110 (4.791) 7.736 (4.536) Science Achievement Lower-SES Proxy (0-25 Books =1) -33.560*** (1.656) -31.758*** (1.791) Country (Qatar = 1) -43.532*** (2.324) -43.981*** (2.485) Treatment Year (2015 / 2019 = 1) 9.796*** (1.750) 21.245*** (1.598) DDD Stratification Estimator 1.712 (5.079) 13.724 ** (4.940) Analytic Sample (N) 36,567 38,581 Note. Regression coefficients (B) are reported with robust standard errors in parentheses. All models are weighted using a normalised TOTWGT and include the full material possession, demographic, and behavioural controls. *** p \u003c .001, ** p \u003c .01, * p \u003c .05. Page 26 of 47","CHAPTER 5: DISCUSSION AND POLICY IMPLICATIONS 5.1 Revisiting the Laboratory Divide Sociologically, the UAE’s marketised trajectory exemplifies EMI (Lucas, 2001). In a fee-regulated quasi-market, financial sorting generates a ceiling that contributes directly to the laboratory divide observed in this study. The performance-linked fee structure creates a regressive feedback loop where elite institutions consolidate resources, generating high within-sector variance in laboratory quality and usage (Pfeffer & Salancik, 2003; Ridge et al., 2015). Qatar’s state-led consolidation circumvented this specific infrastructural EMI mechanism by leveraging the state’s comparative advantage in coordinating and mass-procuring science infrastructure across the public-school system. Unlike fragmented lower- or middle- tier private-operators in the quasi- market, the rentier state possesses the immense fiscal capacity and centralised logistical reach necessary to achieve economies of scale. By decoupling physical capital from market mechanisms, Qatar absorbed the financial burden of infrastructural standardisation. Making laboratory access a universal public baseline, the state enabled lower-SES students to convert ambition into measurable gains without requiring them to navigate the financial tracking mechanisms of the private sector. The empirical divergence between Mathematics and Science supports RDT by demonstrating that decentralised quasi-markets are ill-suited to distribute capital-intensive infrastructure equitably. As Mathematics is an infrastructure-light domain, higher-SES families can easily bypass school- level deficits by purchasing private supplementary tutoring in the pervasive shadow education market in the Gulf that heavily stratifies achievement (Bray & Hajar, 2022; Romanowski et al., 2013). Consequently, centralising public provision yielded negligible stratification gains in Mathematics (B = 4.29, p > .05), as privileged families retained their qualitative advantage through the private tuition market. In contrast, Science remains highly infrastructure-bound. As households cannot easily replicate capital-intensive laboratories through private tutors, standardising physical school facilities via centralisation successfully bridged the laboratory divide for lower-resourced cohorts and significantly compressed the socioeconomic gradient (B = 12.57, p \u003c .001). However, as the Mathematics results indicate, EMI continues to thrive via shadow education in resource-light domains. If the post-2016 educational gains were merely the result of a general economic boom, the stratification gradient would have compressed uniformly across all subjects. Isolating the stratification shift to capital-intensive Science provides strong evidence that replacing the quasi-market with a centralised public default alleviated the physical resource constraints burdening vulnerable cohorts. More broadly, the comparison shows that stratification Page 27 of 47","in the Gulf is not produced by marketisation alone, but by the interaction of governance design with the infrastructure and resource intensity of particular subjects. 5.2 Unmasking the Expatriate Premium and Structural Migrant Penalties The persistent explanatory power of the foreign-birth and SES proxies across all specifications suggests that demographic stratification remains a central determinant in rentier education systems. The UABP’s stratification dynamics mirror historical marketisation in Chile, which exacerbated socioeconomic segregation by concentrating high-SES parents in premium educational environments (Valenzuela et al., 2014). However, the Gulf remains distinctive because its educational market is layered onto a prominent expatriate and migrant hierarchy. The model’s demographic covariates reveal a sharp penalty (B = -38.35) for migrant students in Science and a substantial expatriate premium (B = 65.65) for those with foreign-born parents. Contemporary empirical studies highlight similar aggregate disparities. For instance, Marquez et al. (2022) utilised PISA 2018 data to demonstrate that children of expatriates in the UAE outperform national students by the equivalent of nearly three years of schooling. That magnitude reinforces the view that apparent expatriate advantage in the Gulf reflects a highly selective population structure rather than a uniform migrant effect. However, this pattern is not well explained by the Western migration sociology concept of “positive selection”, which posits that the most educated or ambitious individuals self-select to migrate (Feliciano, 2005, pp. 132—133). In the Gulf, the K-12 population is shaped by kafala- based exclusion and left-censoring. This obscures a bifurcated migrant hierarchy with an advantaged expatriate segment at the top and a lower-SES migrant middle squeezed between unaffordable shadow education and under-resourced schools (Bray & Hajar, 2022). Furthermore, foreign-born status adds distinct disruption effects such as language transitions and discontinuous schooling that a locally-born child of foreign-born parents largely avoids, further compounding the vulnerabilities of this precarious cohort. Drawing on the tracking literature, sorting students into stratified learning environments exacerbates inequality (Hanushek & Wo8mann, 2006; Chmielewski, 2014). Although the UAE does not formally stream students, fee-based schooling produces a de facto financial tracking effect that concentrates advantaged families in elite schools while leaving lower-SES migrants in weaker ones. As Qatar's 2016 recentralisation was confined to the public sector serving mostly citizens, it bypassed these migrant cohorts, leaving them exposed to the systemic vulnerabilities inherent in a fee-regulated private market. The implication is that migrant stratification in the Gulf is produced less by simple individual sorting than by institutional filtering embedded in Page 28 of 47","migration governance and school-market access. More importantly, Gulf diversification agendas depend on a broader human-capital base, and stratification that concentrates educational resources among elite groups weakens that long-run capacity. 5.3 Navigating the Rentier Psychological Contract and the Reverse Gender Gap Beyond physical infrastructure and migration hierarchies, policymakers can directly confront the entrenched reverse gender gap characteristic of rentier states (Ridge, 2014). The regression data highlights a penalty for male citizens in Science (B = -14.11, p \u003c .001), reflecting the demotivation associated with the traditional rentier psychological contract. Historically, this contract has been highly transactional, where the state distributes hydrocarbon wealth via guaranteed public-sector employment and allowances (Beblawi & Luciani, 1987), systematically crowding out the intrinsic motivation required to engage with rigorous STEM domains (Deci & Ryan, 1985; Le Grand, 2003). By dismantling the quasi-market of independent schools in 2016 and committing to centralised public provision, the Qatari state executed a macro-level shift designed to resolve a severe institutional bind. Survey data revealed citizens were deeply dissatisfied with independent schools, yet they largely declined to utilise state vouchers to migrate to private schools, constrained by a strong cultural attachment to the Arabic language, Islamic studies, and traditional values preserved within the state system (Benmansour, 2017). Furthermore, qualitative accounts from the pre-2016 era demonstrate that the fragmented, RAND-designed quasi-market induced role ambiguity, loss of professional identity, and deep resistance among school leaders and parents (Romanowski et al., 2013). In rentier states where citizens constitute a small fraction of the total population, public education serves as a primary structural mechanism for protecting cultural values, preserving public legitimacy, and securing civic loyalty (Cochrane et al., 2024). By reabsorbing these independent operators back into a traditional ministerial hierarchy, the state did not merely reallocate physical resources to close the laboratory divide. It reduced the cultural and cognitive frictions of the quasi- market, deploying institutional facilitation as a state-building tool. Ultimately, resolving this bind materially altered the transactional nature of the rentier psychological contract. Understanding how this structural redesign shapes individual decision-making and fosters mutual civic engagement therefore requires applying a dedicated behavioural lens. Page 29 of 47","5.4 Policy Synthesis: A Behavioural Lens While RDT and EMI explain the structural distribution of educational advantages, future interventions and policymaking warrant a clearer understanding of human decision-making within these architectures. A behavioural approach, drawing on insights from Behavioural Public Policy (BPP) while remaining cognisant of its Western-centric limitations (Henrich et al., 2010; Oliver, 2017), unpacks how different governance models perpetuate or mitigate stratification. In the UAE, the state’s attempt to manage its quasi-market through a libertarian paternalist choice architecture (Thaler & Sunstein, 2003), specifically tying tuition fee caps to inspection ratings (KHDA, 2017), constitutes a regulatory “budge” aimed at curbing provider rent-seeking (Oliver, 2015). However, navigating this heavily financialised choice architecture imposes a substantial cognitive tax on parents. As cognitive bandwidth is a finite resource heavily depleted by socioeconomic vulnerability (Mullainathan & Shafir, 2013), this regulatory complexity disproportionately burdens lower-SES families. Viewed through the lens of EMI, this cognitive tax acts as an invisible barrier, preventing marginalised non-citizens from securing the infrastructural resources concentrated in higher-tier schools. To dismantle this stratification, policymakers should shift from i-frame expectations that rely on vulnerable parents to act as hyper-rational market consumers toward systemic s-frame interventions (Chater & Loewenstein, 2022). Decoupling baseline physical resources from complex fee matrices would redesign systemic defaults, ensuring structural RDT deficits are not behaviourally compounded. Conversely, Qatar’s recentralisation resolved a cultural bind for its citizens. By directly providing better public education, Qatar shifted from a transactional rentier contract to a reciprocal social contract of mutual civic and academic engagement (Amin & Cochrane, 2023; Oliver, 2019), a configuration Besley (2020) links to state capacity. In doing so, it structurally bypassed the quasi- market’s cognitive tax burden through institutional facilitation, an s-frame (systemic) intervention (Chater & Loewenstein, 2022). In this dissertation, institutional facilitation refers to the state’s redesign of educational conditions so that individual educational aspirations can more readily translate into achievement. However, contemporary analyses complicate this reciprocity narrative by revealing that Qatari educational policymaking remains heavily top-down while navigating structural tensions between central oversight and localised stakeholder integration (Al-Thani, 2025) and that its private school sector continues to expand via parallel citizen voucher programmes (Amin & Cochrane, 2023). This duality reveals a pragmatic policy balance. Qatar has not entirely abandoned educational privatisation, but has instead insulated its core citizen population within a high-quality public default while maintaining market options. The long-term durability of this behavioural reciprocity depends on preventing a renewed RDT divide. If the state fails to maintain absolute quality parity between public provision and private voucher Page 30 of 47","alternatives, higher-SES families will inevitably leverage their capital to migrate. This would inadvertently revert the system to market-based tracking and trigger the mechanisms of EMI. This interplay between systemic design and individual agency is further illuminated by the regression covariates. The significant predictive power of individual educational expectations (B = 20.10, p \u003c .001) suggests a dynamic rooted in the self-fulfilling prophecy (Merton, 1948). This points specifically to the Galatea effect, where students’ own expectations of themselves directly drive effort and outcomes but remain heavily influenced by structural “institutional identity trappings” (Tuckman & Bierman, 1971, p. 4). This explains why upward placement in stratified school hierarchies directly enhances self-expectations and subsequent academic performance. Further, this demonstrates that individual ambition matters but encounters a strict ceiling when an institution suffers from high infrastructural variance. Such findings indicate that i-frame programmes aimed at fostering a “growth mindset” (OECD, 2021) can elevate expectations but risk devolving into negative Golem effects (Babad et al., 1982) if they are not matched by s-frame reforms that reconfigure the systemic environment and institutional defaults. In Qatar, the s- frame shock of recentralisation did not replace the need for individual ambition. Rather, it provided the structural support necessary for that ambition to materialise. Consequently, future policy formulation addressing structural stratification requires targeted interventions. As infrastructural deficits most severely penalise marginalised migrant subgroups in resource-heavy subjects like Science, policy should prioritise equitable physical resourcing alongside integration programmes. In contrast, resolving the demotivation associated with the rentier psychological contract among male citizens (Ridge, 2014) requires deliberate structural nudges (Thaler & Sunstein, 2008) specifically within human-capital-intensive domains like Mathematics. Overall, centralisation and marketisation generate different stratification patterns across academic domains, and genuine systemic fairness depends on matching behavioural levers with robust structural guarantees. To break the cycle of EMI, policymakers may need to intentionally redesign their educational defaults to minimise the structural conditions that perpetuate stratification. Page 31 of 47","CHAPTER 6: CONCLUSION 6.1 Summary of Findings This dissertation hypothesised that the architecture of educational governance fundamentally shapes distributional stratification. Utilising a Most Similar Systems Design (MSSD) to compare systemic trajectories in Qatar and the UAE between 2015 and 2019 (Przeworski & Teune, 1970), the quasi-experimental estimators suggest that governance architecture matters for educational stratification in highly differentiated and conditional ways. The 2016 return to centralised public provision in Qatar successfully compressed the socioeconomic achievement gap relative to the marketised trajectory of the UAE. As the underlying TIMSS student-level microdata pools public and private school sectors, these models estimate an ITT effect. The inclusion of unaffected private school students dilutes the treatment coefficient, meaning that obtaining statistically significant stratification compression (B = 12.57, p \u003c .001) suggests that the true systemic impact is highly robust and likely represents a conservative, lower-bound estimate of the policy's efficacy. This equalising effect was notably subject-specific. In Mathematics, the centralisation reform did not significantly alter the socioeconomic gradient, aligning with RDT expectations for a resource- light domain. In contrast, the same reform substantially compressed stratification for the most vulnerable cohorts in infrastructure-dependent Science. By controlling for observable covariates, this study unmasked significant demographic suppressor effects endemic to the Gulf. The models demonstrated that while individual ambitions are highly predictive of achievement, they cannot unilaterally neutralise institutional penalties, such as the severe non-citizen penalty affecting the precarious middle-tier of migrants, or the demotivation of male citizens. Ultimately, the findings show that centralisation compressed the Science achievement gap within the public sector, while private-market penalties remained intact. The equalising effect of centralisation is therefore domain-specific and structurally bounded. 6.2 Theoretical Contributions Bridging the sociology of educational inequality with BPP, this study interprets Qatar's post-2016 reforms through Chater & Loewenstein’s (2022) concept of s-frame interventions. Viewed through this framework, recentralisation acts as a mechanism of state-led institutional facilitation. It aligns institutional supply with the behavioural demand for learning and ensures the environment permits individual motivations to succeed. Page 32 of 47","While contemporary BPP often assumes that informed individuals can navigate quasi-markets effectively, the results demonstrate that such i-frame mechanisms possess limited equalising capacity in domains dependent on shared physical capital (Pfeffer & Salancik, 2003). Addressing entrenched stratification therefore requires s-frame reform, such as mass-procuring standardised laboratories, rather than an exclusive reliance on psychological nudges (Thaler & Sunstein, 2008). Furthermore, the highly significant baseline gain for Qatar in Science lends weight to theories of institutional reciprocity. By replacing a fractured demand-led market with high-quality public provision, the state signals a commitment to structural fairness, which may foster greater collective academic engagement than models that treat citizens strictly as rational consumers (Oliver, 2019). 6.3 Limitations and Future Research As detailed in Section 3.5, causal inferences from this cross-sectional MSSD are inherently constrained by potential unobserved policy shocks and unclustered standard errors. Furthermore, the reliance on the books-at-home proxy and the left-censored nature of the kafala demographic data mean these estimators capture effects for a truncated middle-tier of migrants rather than the absolute bottom of the socioeconomic spectrum. Future research should leverage true longitudinal panel data and context-specific economic capital indices to trace individual-level academic mobility over time, bypassing the psychometric limitations and poor cross-cultural comparability of static cultural proxies in ILSAs (Marks & O'Connell, 2021; Rutkowski & Rutkowski, 2013). Furthermore, subsequent quantitative models will need to account for the 2020-2022 pandemic disruption. This systemic shock confounds any post-2019 Gulf governance comparison and will require careful pre-pandemic baseline controls in the next TIMSS or PISA cycle. Finally, while this study establishes the macro-distributional impacts of these governance architectures, the quantitative bounds of the DDD model intentionally leave the internal pedagogical environment unexamined. To avoid econometric “bad controls”, this design deliberately set aside institutional questionnaires embedded within the TIMSS architecture, principal administrative notes, and detailed facility data regarding science laboratories. Therefore, future research must employ multi-level quantitative models and qualitative methodologies, such as ethnographic observation, to open this “black box” of policy implementation, uncover the unobserved causal mechanisms, and triangulate these macro- structural findings with granular school-level data. Investigating how street-level bureaucrats exercise pedagogical discretion and manage physical resources in response to recentralisation will Page 33 of 47","provide vital nuance to the gradients identified here, capturing the lived realities of educators navigating the Gulf's evolving quasi-markets. 6.4 Concluding Remarks Avoiding educational stratification in resource-rich societies cannot be outsourced to the logic of the marketplace. These patterns reflect not only differences in outcomes but also unequal access to the physical and institutional conditions required for success. While regulatory frameworks and informational nudges may incentivise top-tier institutional performance, they can also operate as de facto financial tracking for those lacking the capital to navigate them. As Gulf states transition toward a post-hydrocarbon future, this study suggests that equitable human capital development is not guaranteed by market competition alone, but benefits greatly from the state’s intentional facilitation. Although rooted in the political economy of the Arab Gulf, these findings carry broader implications for global education policy. The contrast between Mathematics and Science suggests that in highly stratified systems built on fee-linked educational infrastructure, centralised state funding of physical capital is often more effective at compressing gaps than demand-side market reforms. Behavioural nudges and individual ambitions still matter for academic mobility, but they cannot compensate for a missing foundational baseline. By extension, for education systems globally, the evidence suggests that choice architecture can complement, but cannot substitute for adequate infrastructure and targeted state expenditure. Page 34 of 47","References Abu Dhabi Department of Education and Knowledge (ADEK). (2019). ADEK announces operators for Charter Schools project. Government of Abu Dhabi. Adler, J. (2000). Conceptualising resources as a theme for teacher education. Journal of mathematics teacher education,
